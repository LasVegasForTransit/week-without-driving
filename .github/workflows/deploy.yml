name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: write
  packages: read

concurrency:
  group: lvwwd-staging
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: LasVegasForTransit/repository-tooling/.github/workflows/release-build.yml@3567f0cb1345e8756eb5d84e0a3ea7b62695125a
    with:
      artifact-source: typed-worker
      require-analytics: true
      build-environment: production
      app-directory: apps/site
      validation-browser-directory: apps/site
      artifact-prefix: lvwwd-release
    secrets: inherit

  attest:
    name: Sign retained release
    needs: build
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: write
      id-token: write
    uses: LasVegasForTransit/repository-tooling/.github/workflows/release-attest.yml@3567f0cb1345e8756eb5d84e0a3ea7b62695125a
    with:
      artifact-prefix: lvwwd-release

  staging:
    name: Verify and update staging
    needs: [build, attest]
    uses: LasVegasForTransit/repository-tooling/.github/workflows/release-publish.yml@3567f0cb1345e8756eb5d84e0a3ea7b62695125a
    with:
      target: preview
      publication-mode: named-staging
      preview-environment: worker-preview
      production-environment: production
      release-id: ${{ github.run_id }}
      commit: ${{ github.sha }}
      artifact-prefix: lvwwd-release
      attestation-prefix: attestation-lvwwd-release
      app-directory: apps/site
      url: ${{ vars.LVBT_PREVIEW_URL }}
      smoke-script: release:smoke
      browser-script: release:browser
    secrets: inherit
