# Deploys every app with a wrangler config on each push to main, after the
# same check pull requests run. Needs the CLOUDFLARE_API_TOKEN (Edit Cloudflare
# Workers) and CLOUDFLARE_ACCOUNT_ID secrets of the production environment;
# `pnpm bootstrap --production` sets both (see apps/site/platform.json).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Installs @lasvegasfortransit packages from GitHub Packages.
  packages: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Deploy
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # lvwwd.org's Cloudflare Web Analytics token, a variable of the
          # production environment. The build adds LVBT's analytics only
          # when it is set; see docs/operations/reference/analytics.md.
          PUBLIC_LVBT_CWA_TOKEN: ${{ vars.PUBLIC_LVBT_CWA_TOKEN }}
